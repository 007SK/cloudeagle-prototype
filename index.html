<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudEagle Integration Builder — Swati Kumari</title><style>
:root{--blue:#285ae8;--navy:#14233c;--bg:#f6f8fc;--line:#e2e7ef;--muted:#63718a;--green:#167352;--amber:#a45a0a}*{box-sizing:border-box}body{margin:0;color:var(--navy);font:14px/1.5 Arial,sans-serif;background:var(--bg)}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);padding:11px 17px;background:white;border-radius:7px;color:var(--navy);font-weight:600}button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:transparent;border-color:transparent}.small{font-size:12px;padding:7px 11px}.shell{display:flex;min-height:100vh}.sidebar{width:212px;flex-shrink:0;background:white;border-right:1px solid var(--line);padding:26px 18px;position:fixed;top:0;bottom:0}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px;margin:0 0 32px}.brand b{color:var(--blue)}.navlabel{font-size:10px;letter-spacing:1.3px;color:var(--muted);margin:25px 12px 8px}.navitem{display:block;padding:12px;color:var(--muted);border-radius:7px;margin:3px 0}.navitem.active{background:#edf2ff;color:var(--blue);font-weight:bold}.workspace{position:absolute;bottom:25px;border-top:1px solid var(--line);padding-top:18px;width:176px}.workspace small{color:var(--muted)}.body{margin-left:212px;width:calc(100% - 212px)}.topbar{background:white;border-bottom:1px solid var(--line);padding:16px 34px;display:flex;align-items:center;justify-content:space-between}.topbar span{font-size:12px;color:var(--muted)}.demo{background:#fff4d8;padding:8px 34px;font-size:12px;color:#775119;border-bottom:1px solid #f1dfac}.container{max-width:1280px;margin:auto;padding:26px 34px 36px}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:bold;color:var(--blue);text-transform:uppercase}h1{font-size:29px;letter-spacing:-.6px;line-height:1.2;margin:7px 0 9px}h2{font-size:19px;line-height:1.3;margin:0 0 8px}h3{font-size:15px;margin:0 0 8px}p{margin:6px 0 16px}small,.muted{color:var(--muted)}.subtitle{color:var(--muted);margin-bottom:24px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:18px}.rail .panel{padding:20px}.rail p,.rail li{font-size:12px;color:var(--muted)}.rail ol{padding-left:18px}.rail li{margin-bottom:13px}.rail a{color:var(--blue)}.steps{display:flex;gap:8px;padding:0;margin:0 0 24px;list-style:none}.steps li{flex:1;padding:9px 5px;border-bottom:3px solid var(--line);font-size:11px;color:var(--muted)}.steps li.current{border-color:var(--blue);color:var(--blue);font-weight:bold}.steps li.done{border-color:#92c3b0}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:5px;font-size:11px;background:#edf2ff;color:var(--blue);font-weight:600}.tag.green{background:#e8f5ef;color:var(--green)}.tag.amber{background:#fff3dc;color:var(--amber)}.tag.gray{background:#f0f2f6;color:var(--muted)}.tag.red{background:#ffefef;color:#b43939}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.appmark{display:inline-grid;place-items:center;background:var(--blue);color:white;border-radius:12px;width:44px;height:44px;font-size:23px;font-weight:bold;flex-shrink:0}.apphead{display:flex;align-items:center;gap:14px;margin-bottom:24px}.apphead h2{margin:0}.apphead small{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tool{display:block;text-align:left;padding:22px;min-height:185px}.tool h3{margin-top:18px}.tool p{font-size:12px;color:var(--muted);font-weight:normal}.field{display:block;font-weight:600;margin:18px 0 7px}input[type=text],input[type=url],select{width:100%;border:1px solid #cdd5e1;border-radius:7px;padding:12px;background:white;color:var(--navy)}input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue)}.hint{font-size:12px;color:var(--muted);margin:7px 0 18px}.note{border-left:3px solid #7198ed;background:#f1f5ff;padding:13px 15px;font-size:12px;margin:18px 0}.note.warning{border-color:#dda642;background:#fff8e8}.note.error{border-color:#d46a6a;background:#fff1f1;color:#912f2f}.note.success{border-color:#59a687;background:#edf8f2}.actions{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.cap{border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start}.cap.selected{border-color:#b4c7fc;background:#f7f9ff}.cap p{font-size:12px;margin:5px 0 0;color:var(--muted)}.details{margin:10px 0}.details>div{display:grid;grid-template-columns:155px 1fr;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}dt{color:var(--muted);font-size:12px}dd{margin:0;font-size:13px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0}.tabs button{border:0;border-radius:0;background:transparent;padding:12px}.tabs .selected{border-bottom:3px solid var(--blue);color:var(--blue)}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#12213a;color:#d9e6ff;padding:20px;border-radius:7px;max-height:390px;overflow:auto}.files{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.files .selected{color:var(--blue);background:#edf2ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat{padding:17px;border:1px solid var(--line);border-radius:8px}.stat strong{display:block;font-size:27px}.stat span{font-size:11px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);background:#f7f9fc;font-weight:600}th,td{padding:12px;border-bottom:1px solid var(--line)}.check{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.check b{color:var(--green);margin-right:10px}.check small{float:right}.checks{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:14px}.checks input{flex-shrink:0}.center{text-align:center;padding:35px 16px}.circle{display:inline-grid;place-items:center;background:#e9f5ef;color:var(--green);height:64px;width:64px;border-radius:50%;font-size:28px;margin-bottom:18px}.login{max-width:490px;margin:45px auto}.login .brand{margin-bottom:24px}.spinner{height:32px;width:32px;border:3px solid #dce6fc;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:25px auto}@keyframes spin{to{transform:rotate(360deg)}}.footer{font-size:11px;color:var(--muted);padding-top:18px}.link{color:var(--blue);text-decoration:underline;background:none;border:0;padding:0;font-weight:normal;font-size:12px}.audit{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.audit small{display:block}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--navy);color:white;border-radius:8px;z-index:20}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}.rail{display:none}.container{padding:24px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.sidebar{display:none}.body{margin-left:0;width:100%}.cards{grid-template-columns:1fr}.topbar,.demo{padding:12px 18px}.container{padding:20px 15px}.steps{gap:2px}.steps li{font-size:9px}.panel{padding:18px}.details>div{grid-template-columns:115px 1fr}.stats{gap:7px}.stat{padding:10px}.row{flex-wrap:wrap}h1{font-size:25px}}
</style></head><body><div id="app"></div><div id="toast" class="toast" hidden role="status"></div><script>
'use strict';
const FIGMA='https://www.figma.com/design/1Ox2ytbXh4QLWU2kCGaWxq/CloudEagle-Integration-Builder-Assignement';
const DOCS='https://developer.calendly.com/api-docs/overview/api/reference';
const S={page:'login',members:true,events:true,url:DOCS,sample:false,live:false,authorized:false,approved:false,active:false,paused:false,scenario:'healthy',tab:'config',file:'client.js',error:'',audit:[],query:''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(action,label,primary=false,disabled=false)=>`<button type="button" data-action="${action}" class="${primary?'primary':''}" ${disabled?'disabled':''}>${label}</button>`;
const tag=(text,style='')=>`<span class="tag ${style}">${text}</span>`;
const selected=()=>[S.members?'Organization members':'',S.events?'Scheduled meeting activity':''].filter(Boolean).join(' + ');
const scopes=()=>['users:read',...(S.members?['organizations:read']:[]),...(S.events?['scheduled_events:read']:[])];
const apphead=()=>`<div class="apphead"><span class="appmark">C</span><div><h2>Calendly</h2><small>Custom connector · version 1</small></div>${tag(S.page==='write'?'Write preview':'Read operations',S.page==='write'?'amber':'')}</div>`;
const notice=()=>`<div class="note warning"><strong>Demo only.</strong> Prepared connector examples and fictional Northstar data. No AI model, account authorization or external API is called.</div>`;
function actions(back,next,label,disabled=false){return `<div class="actions">${btn(back,'← Back')}${btn(next,label,true,disabled)}</div>`}
function audit(message){S.audit.unshift({message,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})})}
function resetEvidence(){S.sample=false;S.live=false;S.approved=false;S.active=false;S.audit=[]}
function go(page){S.page=page;S.error='';render();window.scrollTo(0,0);document.getElementById('title')?.focus({preventScroll:true})}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;setTimeout(()=>el.hidden=true,3500)}
function download(name,data,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const code={
'client.js':`// Prepared example — not generated by a live model in this demo.\n// Server-side client; credentials come from a secret store.\nconst BASE = 'https://api.calendly.com';\nconst READ_PATHS = new Set([\n  '/users/me', '/organization_memberships', '/scheduled_events'\n]);\nexport async function get(path, query, token) {\n  if (!READ_PATHS.has(path)) throw new Error('Endpoint blocked');\n  const url = new URL(path, BASE);\n  Object.entries(query).forEach(([k,v]) => url.searchParams.set(k,v));\n  return requestWithRetry(url, {\n    method: 'GET', redirect: 'error',\n    headers: {Authorization: 'Bearer ' + token},\n    signal: AbortSignal.timeout(10000)\n  });\n}\n// requestWithRetry is described in errors.js.`,
'auth.js':`// Proposed customer-facing OAuth setup — illustrative only.\n// No secrets, tokens or OAuth requests are used in this demo.\n// 1. Start authorization on the server with an expiring state nonce.\n// 2. Request only scopes needed by selected capabilities.\n// 3. Verify state and exchange authorization code on the server.\n// 4. Encrypt credentials in a tenant-scoped secret store.\n// 5. Resolve /users/me and verify organization and admin access.\n// 6. Never send credentials to the language model or browser logs.\n\nconst scopes = SELECTED_SCOPES;\n// A changed account or scope invalidates previous test evidence.`,
'members.js':`// Organization members — illustrative mapping.\n// GET /organization_memberships?organization={organizationURI}\n// Scope: organizations:read\nconst fields = {\n  id: 'user.uri',\n  name: 'user.name',\n  role: 'role'\n};\n// Read collection across ALL next_page_token pages.\n// Validate required fields and deduplicate by stable user URI.\n// A missing page blocks publication; do not present partial as complete.`,
'activity.js':`// GET /scheduled_events · scope scheduled_events:read\n// Query organization, min_start_time and max_start_time.\n// Count distinct non-canceled event URIs with start times\n// within the previous 30 days in UTC, excluding future events.\n// Attribute each event once to each listed host:\n// event.event_memberships[].user\n//\n// Zero is valid only after complete retrieval of the selected window.\n// Failed or missing retrieval = unknown, never zero.\n// This is meeting activity, not logins or license utilization.`,
'pagination.js':`// Cursor pagination — illustrative algorithm.\nlet cursor = null;\nconst seenCursors = new Set();\nfor (let page = 0; page < 20; page++) {\n  const data = await readPage({page_token: cursor});\n  validateSchema(data);\n  stageRecords(data.collection);\n  cursor = data.pagination.next_page_token;\n  if (!cursor) { publishCompleteSnapshot(); break; }\n  if (seenCursors.has(cursor)) throw new Error('Pagination loop');\n  seenCursors.add(cursor);\n  if (page === 19) throw new Error('Incomplete — page limit reached');\n}\n// Page count is not an authoritative organization-wide user total.`,
'errors.js':`// Error handling and safe logging — policy pseudocode.\n// 401 → reconnect account; 403 → review scopes and role.\n// 429 → honor Retry-After within bounded limits.\n// 5xx/network → retry with exponential backoff and a retry cap.\n// Invalid schema, repeated cursor or partial retrieval → block activation.\n// Keep the last complete snapshot; never silently overwrite with partial data.\n//\n// Log: connector version, request ID, endpoint, status, page and count.\n// Redact: credentials, authorization headers and personal payloads.\n// Execute generated code in an isolated environment with allowlisted egress.\n// Code changes require new tests and approval.`
};
function exportExample(){download('calendly-connector-example.json',JSON.stringify({artifact:'Illustrative connector package',simulation:true,productionReady:false,version:1,documentation:S.url,capabilities:selected(),scopes:scopes(),files:Object.fromEntries(Object.entries(code).filter(([k])=>(S.members||k!=='members.js')&&(S.events||k!=='activity.js')).map(([k,v])=>[k,v.replace('SELECTED_SCOPES',JSON.stringify(scopes()))])),limitations:'Prepared code and pseudocode for product demonstration. Not an executable production integration.'},null,2))}
const titles={login:['Welcome to CloudEagle','One workspace for your SaaS applications.'],catalog:['Find your next integration','Search applications and build a custom connector for the capabilities you need.'],docs:['Start with API documentation','Application documentation is the technical input. Your account is connected later.'],capabilities:['Choose what this integration can do','Review the capabilities discovered from the documentation.'],review:['Review your generated connector','Inspect permissions, data mappings and code before connecting an account.'],auth:['Connect your application account','Authorize the selected capabilities for the correct company workspace.'],test:['Test before you activate','Check connector behavior separately from account access.'],live:['Verify the account connection','A limited live-read workflow, demonstrated with dummy results.'],activate:['Review and activate','Approve a specific version, account and scope.'],monitor:['Monitor your integration','Track sync health and pause the connection when needed.'],approval:['Awaiting administrator approval','Your tested connector remains inactive until an authorized reviewer approves it.'],write:['Preview a write action','Governance actions need separate permissions, a safe test target and approval.'],busy:['Preparing your connector','Showing the generation experience using a prepared example.']};
const positions={docs:0,capabilities:1,review:2,auth:3,test:4,live:4,activate:5,approval:5,monitor:6,write:1};
function rail(){return `<aside class="rail"><section class="panel"><div class="eyebrow">You stay in control</div><h3 style="margin-top:12px">Build without becoming a developer</h3><ol><li>Select the outcome, then review the inferred permissions and fields.</li><li>Test behavior and access before approving activation.</li><li>Monitor data quality and keep sensitive actions behind approval.</li></ol></section><section class="panel"><h3>What this demo shows</h3><p>Calendly is the worked example. Other application cards illustrate a broader integration catalogue.</p><p>Prepared code, simulated testing and fictional data demonstrate the product experience.</p><a href="${FIGMA}" target="_blank" rel="noopener">View Figma designs ↗</a></section><section class="panel"><h3>Proposed AI model</h3><p>Claude Sonnet 5.5. It would interpret public documentation and suggest a structured connector plan. No model is connected in this prototype.</p></section></aside>`}
function login(){return `<div class="login panel"><div class="brand">cloud<b>eagle</b></div><h2>Sign in to your workspace</h2><p class="muted">Explore the Northstar demo as an IT administrator.</p><label class="field" for="email">Work email</label><input id="email" type="text" value="it.admin@northstar.example" readonly><p class="hint">Fictional workspace · no password required</p><button data-action="catalog" class="primary" style="width:100%">Continue to demo workspace →</button><p class="hint" style="margin-top:18px">Sign-in is simulated. No credentials are collected.</p></div>`}
function catalog(){return `<section class="panel"><div class="row"><h2>Available applications</h2>${tag('Demo catalogue','gray')}</div><label class="field" for="search">Search tools</label><input id="search" type="text" placeholder="Search Calendly, Slack, Salesforce…" value="${esc(S.query)}"><p class="hint">Calendly is interactive. Other cards are catalogue examples.</p><div class="cards" id="tool-cards">${toolCards()}</div><div class="note">Use an existing managed connector when it meets your needs. The custom builder covers missing applications or missing capabilities; this demo does not assert Calendly is absent from CloudEagle’s catalogue.</div></section>`}
function toolCards(){return ['Calendly','Slack','Salesforce'].filter(n=>n.toLowerCase().includes(S.query.toLowerCase())).map((n,i)=>`<button class="tool" data-action="${n==='Calendly'?'docs':'catalog-info'}"><span class="appmark" style="background:${n==='Slack'?'#75477b':n==='Salesforce'?'#0f9cd7':'#285ae8'}">${n[0]}</span><h3>${n}</h3><p>${n==='Calendly'?'Members, meeting activity and governance':'Catalogue preview · setup not included'}</p>${tag(n==='Calendly'?'Build custom connector →':'Preview only','gray')}</button>`).join('')||'<p class="empty">No demo tools match. Try Calendly.</p>'}
function docs(){return `<section class="panel">${apphead()}<h2>Where is the API documentation?</h2><p class="muted">Provide official documentation or an OpenAPI specification.</p><label class="field" for="docs">API documentation URL</label><input id="docs" type="url" value="${esc(S.url)}"><p class="hint">This demo recognizes Calendly documentation and loads a prepared analysis.</p><div class="note"><strong>No company questionnaire required.</strong> The API docs describe what is possible; capability selection defines what you need. Account, permissions and organization are configured later.</div>${S.error?`<div class="note error" role="alert">${esc(S.error)}</div>`:''}<button class="link" data-action="docs-fail">Preview inaccessible documentation</button>${actions('catalog','analyze','Analyze documentation →')}</section>`}
function capabilities(){return `<section class="panel">${apphead()}<div class="row"><h2>Available capabilities</h2>${tag('Prepared analysis','gray')}</div><p class="hint">Select one or both read capabilities. Writes follow a separate approval path.</p><label class="cap ${S.members?'selected':''}"><input type="checkbox" id="members" ${S.members?'checked':''}><span><strong>Retrieve organization members</strong> ${tag('Read')}<p>Stable user ID, name and organization role.</p></span></label><label class="cap ${S.events?'selected':''}"><input type="checkbox" id="events" ${S.events?'checked':''}><span><strong>Retrieve scheduled meeting activity</strong> ${tag('Read')}<p>Events in the previous 30 days. An activity signal, not login or license data.</p></span></label><div class="cap"><span style="font-size:20px">◇</span><div><strong>Remove a user from the organization</strong> ${tag('Write','amber')}<p>Offboarding action. Separate write permission and approval required.</p><button class="link" data-action="write" style="margin-top:10px">Explore write safeguards →</button></div></div><div class="note">Capabilities should be grounded in documented endpoints. Missing or ambiguous capabilities require clarification rather than guessed code.</div>${actions('docs','generate','Generate connector →',!S.members&&!S.events)}</section>`}
function review(){return `<section class="panel">${apphead()}${tag('Generation simulated','gray')}<div class="tabs"><button data-action="config-tab" class="${S.tab==='config'?'selected':''}">Configuration</button><button data-action="code-tab" class="${S.tab==='code'?'selected':''}">Generated code</button></div>${S.tab==='config'?`<dl class="details"><div><dt>Capabilities</dt><dd>${selected()}</dd></div><div><dt>API endpoints</dt><dd>${S.members?'GET /organization_memberships<br>':''}${S.events?'GET /scheduled_events':''}</dd></div><div><dt>Authentication</dt><dd>OAuth for a customer connection; server-side secret storage</dd></div><div><dt>Required scopes</dt><dd>${scopes().map(s=>tag(s,'gray')).join(' ')}</dd></div><div><dt>Pagination</dt><dd>Follow next_page_token to completion; stop on repeated cursors or unsafe limits.</dd></div><div><dt>Failure policy</dt><dd>Bounded retries for 429 / transient errors. Missing scopes, invalid fields or incomplete retrieval block activation.</dd></div><div><dt>Logging</dt><dd>Version, status, page and record count. No credentials or full personal payloads.</dd></div></dl><div class="note warning">${S.events?'Meeting activity does not measure logins or paid-license utilization. Missing data is unknown; zero events alone must not trigger license removal.':'Member discovery does not establish paid-license ownership or utilization.'}</div><a href="${DOCS}" target="_blank" rel="noopener" class="link">Official Calendly documentation ↗</a>`:`<p class="hint">Prepared code and pseudocode show the requested components. This package is illustrative, not a deployable production connector.</p><div class="files">${Object.keys(code).filter(k=>(S.members||k!=='members.js')&&(S.events||k!=='activity.js')).map(k=>`<button class="small ${S.file===k?'selected':''}" data-file="${k}">${k}</button>`).join('')}</div><pre>${esc(code[S.file].replace('SELECTED_SCOPES',JSON.stringify(scopes())))}</pre>${btn('download','Download example package')}`}${actions('capabilities','auth','Continue to connect →')}</section>`}
function auth(){return `<section class="panel">${apphead()}<h2>Authorize Northstar’s Calendly account</h2><p class="muted">A Calendly administrator or owner grants organization-level access.</p><dl class="details"><div><dt>CloudEagle workspace</dt><dd>Northstar · fictional company</dd></div><div><dt>Application account</dt><dd>Northstar Calendly · demo organization</dd></div><div><dt>Requested scopes</dt><dd>${scopes().map(s=>tag(s,'gray')).join(' ')}</dd></div><div><dt>Data minimization</dt><dd>No invitee details, meeting notes, locations or calendar changes.</dd></div></dl><div class="note">In production, authorization takes place with the provider. Tokens remain in a secure server-side store and never go into AI prompts.</div>${notice()}${actions('review','authorize','Simulate Calendly authorization →')}</section>`}
const names=['Aarav Mehta','Maya Rao','Sam Chen','Noor Khan','Leo Park'];
function table(limited=false){return `<table><thead><tr><th>${S.members?'Member':'Event host'}</th><th>${S.events?'Meetings in period':'Organization role'}</th><th>Interpretation</th></tr></thead><tbody>${names.map((n,i)=>`<tr><td>${esc(limited?n[0]+'••• (masked)':n)}</td><td>${S.events?[5,4,0,3,7][i]:i===0?'Admin':'Member'}</td><td>${S.events?(i===2?'No events observed':'Events observed'):'Membership only'}</td></tr>`).join('')}</tbody></table><p class="hint">Five fictional rows shown. ${S.events?'Zero is meaningful only after complete retrieval; this is a prepared sample.':''}</p>`}
function test(){return `<section class="panel">${apphead()}<div class="row"><h2>1. Sample behavior tests</h2>${tag('Simulated','gray')}</div><p class="hint">Prepared API responses demonstrate logic checks. They do not verify real account access.</p><label class="field" for="scenario">Choose a test scenario</label><select id="scenario">${Object.entries({healthy:'Healthy connector',rate:'Rate limit recovered',partial:'Incomplete pagination — blocked',permission:'Missing permission — blocked',schema:'Unexpected response schema — blocked'}).map(([v,t])=>`<option value="${v}" ${v===S.scenario?'selected':''}>${t}</option>`).join('')}</select><div style="margin-top:16px">${btn('run-sample','Run sample test simulation',true)}</div>${S.error?`<div class="note error" role="alert"><strong>Activation blocked.</strong> ${esc(S.error)}<br>Partial results are not published. ${S.scenario==='permission'?'Reconnect with an authorized admin.':'Correct the issue, then rerun all required checks.'}</div>${S.scenario==='permission'?btn('auth','Review account access'):btn('recover','Restore healthy sample')}`:''}${S.sample?`<div class="note success"><strong>Sample scenario passed.</strong> These are illustrative results, not execution evidence for a real connector.</div><div class="check"><b>✓</b>Pagination and stable IDs<small>${S.members?'25 members · 20 + 5':'72 events · multiple pages'}</small></div><div class="check"><b>✓</b>Required fields and selected scope checked</div><div class="check"><b>✓</b>${S.scenario==='rate'?'429 recovered after bounded retry':'Error handling and redacted logging illustrated'}</div><div class="stats"><div class="stat"><strong>${S.members?'25':'72'}</strong><span>${S.members?'Expected sample members':'Sample events'}</span></div><div class="stat"><strong>${S.members?'25':'72'}</strong><span>Illustrated retrieval count</span></div><div class="stat"><strong>0</strong><span>Sample duplicates</span></div></div>${table()}<p class="hint">Expected totals come from the prepared dataset, not the API’s page-count field.</p>`:`<div class="empty">Run a scenario to inspect results and activation safeguards.</div>`}${actions('auth','live','Continue to account verification →',!S.sample)}</section>`}
function live(){return `<section class="panel">${apphead()}<div class="row"><h2>2. Limited account verification</h2>${tag('Simulated live test','amber')}</div><p class="muted">In production, this step verifies actual authorization, scopes and response shape.</p><dl class="details"><div><dt>Read boundary</dt><dd>Selected endpoints only · sample cap of 5 records per endpoint</dd></div><div><dt>Target</dt><dd>Northstar demo organization · no real connection</dd></div><div><dt>Protection</dt><dd>Explicit authorization, masked preview, no writes, no background sync</dd></div></dl>${S.live?`<div class="note success"><strong>Illustrative verification passed.</strong> Account, permissions and sample shape accepted in this scenario. No live request occurred.</div>${table(true)}<div class="note warning">A successful limited preview does not prove a complete sync. Monitor pagination and completeness during the first full run.</div>`:`<div class="note">A vendor sandbox is preferred where available. An authorized, bounded read can use a real account with least privilege. Writes need a safe test environment and separate approval.</div>${btn('run-live','Simulate limited live-test result',true)}`}${actions('test','activate','Review activation →',!S.live)}</section>`}
function activate(){return `<section class="panel">${apphead()}<h2>Review this connection</h2><dl class="details"><div><dt>Version and account</dt><dd>Calendly v1 · Northstar demo</dd></div><div><dt>Selected scope</dt><dd>${selected()}</dd></div><div><dt>Test evidence</dt><dd>Sample scenario passed + limited live-test scenario passed ${tag('Both simulated','amber')}</dd></div><div><dt>Owner</dt><dd>Northstar IT administrator</dd></div><div><dt>Proposed schedule</dt><dd>Daily at 09:00 UTC · no actual job is scheduled</dd></div><div><dt>Write behavior</dt><dd>No write operations enabled. Activation does not remove users.</dd></div></dl><label class="checks"><input type="checkbox" id="approve" ${S.approved?'checked':''}><span>I reviewed the selected permissions, data limitations and simulated test results for this version.</span></label><div class="note">An authorized workspace administrator can activate under policy. Where another approver is required, request approval instead. Any scope, code or account change requires fresh tests.</div><button class="link" data-action="approval">Explore the separate administrator approval path →</button>${actions('live','activate-demo','Activate demo integration →',!S.approved||!S.sample||!S.live)}</section>`}
function approval(){return `<section class="panel"><div class="center"><div class="circle" style="background:#fff4d8;color:#a45a0a">◷</div><h2>Approval requested</h2><p class="muted">Calendly v1 · Northstar · selected read capabilities</p>${tag('Inactive until approved','amber')}</div><dl class="details"><div><dt>Requested by</dt><dd>IT administrator</dd></div><div><dt>Required approver</dt><dd>Authorized workspace administrator under company policy</dd></div><div><dt>Review package</dt><dd>Version, scopes, test results, account and owner</dd></div></dl><p class="hint">No notification is sent. This is an alternative workflow state.</p>${actions('activate','approve-demo','Simulate administrator approval →')}</section>`}
function write(){return `<section class="panel">${apphead()}${tag('Write operation · design demonstration','amber')}<h2 style="margin-top:18px">Remove an organization member</h2><p class="muted">A governance action for approved offboarding.</p><dl class="details"><div><dt>Documented endpoint</dt><dd>DELETE /organization_memberships/{uuid}</dd></div><div><dt>Permission</dt><dd>organizations:write · authorized organization admin</dd></div><div><dt>Proposed target</dt><dd>Demo Member 025 · Northstar test organization</dd></div><div><dt>Before → after</dt><dd>Organization member → membership removed<br>1 affected member · organization owner excluded</dd></div><div><dt>Safe test target</dt><dd>${tag('Not verified','red')} Vendor sandbox or dedicated test account</dd></div><div><dt>Approval</dt><dd>${tag('Not granted','red')} Named approver and explicit execution confirmation</dd></div></dl><div class="note error"><strong>Write execution blocked.</strong> No safe test target, write authorization or approval has been verified. This prototype cannot perform writes.</div><p class="hint">Require target preview, bounded affected-record count, duplicate-request protection and audit history. Reversal depends on the vendor; do not promise automatic rollback.</p><div class="actions">${btn('capabilities','← Return to capabilities')}${btn('write-disabled','Execute write',true,true)}</div></section>`}
function monitor(){return `<section class="panel">${apphead()}<div class="row"><h2>${S.paused?'Connection paused':'Integration active in demo'}</h2>${tag(S.paused?'Paused':'Demo active',S.paused?'amber':'green')}</div>${notice()}<div class="stats"><div class="stat"><strong>${S.members?'25':'72'}</strong><span>${S.members?'Sample members':'Sample events'}</span></div><div class="stat"><strong>${S.events?'72':'—'}</strong><span>${S.events?'Sample events in 30 days':'Activity not selected'}</span></div><div class="stat"><strong>${S.paused?'Paused':'Complete'}</strong><span>Illustrative sync state</span></div></div>${table()}<div class="note warning">${S.events?'Missing activity is unknown. Zero events alone must not drive license reclamation.':'Member data does not establish license utilization.'} A failed real sync would preserve the last complete snapshot and alert the owner.</div><div class="actions">${btn('pause',S.paused?'Resume demo':'Pause demo')}${btn('refresh','Refresh sample',true,S.paused)}</div><h3 style="margin-top:24px">Demo activity history</h3>${S.audit.map(x=>`<div class="audit">${esc(x.message)}<small>${esc(x.time)} · simulated workflow</small></div>`).join('')}<div class="actions">${btn('catalog','Browse integrations')}${btn('review-code','Review connector code')}</div></section>`}
function render(){const [title,sub]=titles[S.page];const content={login,catalog,docs,capabilities,review,auth,test,live,activate,approval,write,monitor,busy:()=>`<section class="panel center"><div class="spinner"></div><h2>Reading docs → mapping capabilities → preparing code</h2><p class="muted">Simulated processing. No model or documentation request is made.</p></section>`}[S.page]();document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">cloud<b>eagle</b></div><div class="navlabel">WORKSPACE</div><span class="navitem">Overview</span><span class="navitem">Applications</span><span class="navitem active">◈ &nbsp; Integrations</span><span class="navitem">Governance</span><div class="navlabel">INTEGRATION BUILDER</div><span class="navitem">Custom connectors</span><div class="workspace"><strong>Northstar</strong><br><small>IT administrator · demo</small></div></aside><div class="body"><header class="topbar"><strong>Integrations <span> / Custom builder</span></strong><div><button class="small ghost" data-action="restart">Restart demo</button> ${tag('NK','gray')}</div></header><div class="demo"><strong>INTERACTIVE PROTOTYPE</strong> · Dummy data · AI generation, authorization, tests and activation are simulated</div><main class="container"><div class="eyebrow">${S.page==='login'?'CloudEagle workspace':'Integration builder'}</div><h1 id="title" tabindex="-1">${title}</h1><p class="subtitle">${sub}</p>${positions[S.page]!==undefined&&S.page!=='monitor'?`<ol class="steps">${['Documentation','Capabilities','Review','Connect','Test','Activate'].map((t,i)=>`<li class="${i===positions[S.page]?'current':i<positions[S.page]?'done':''}">${i+1}. ${t}</li>`).join('')}</ol>`:''}${S.page==='login'?content:`<div class="grid"><div>${content}</div>${rail()}</div>`}<div class="footer">Product concept by Swati Kumari · CloudEagle Senior Product Manager assignment · November 2026</div></main></div></div>`;bind()}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action)));document.querySelectorAll('[data-file]').forEach(el=>el.addEventListener('click',()=>{S.file=el.dataset.file;render()}));document.getElementById('search')?.addEventListener('input',e=>{S.query=e.target.value;document.getElementById('tool-cards').innerHTML=toolCards();document.querySelectorAll('#tool-cards [data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action)))});for(const field of ['members','events'])document.getElementById(field)?.addEventListener('change',e=>{S[field]=e.target.checked;resetEvidence();render()});document.getElementById('scenario')?.addEventListener('change',e=>{S.scenario=e.target.value;resetEvidence();S.error='';render()});document.getElementById('approve')?.addEventListener('change',e=>{S.approved=e.target.checked;render()})}
function act(a){if(a==='restart'){Object.assign(S,{members:true,events:true,url:DOCS,authorized:false,paused:false,scenario:'healthy',tab:'config',file:'client.js',query:''});resetEvidence();go('login');return}if(a==='catalog-info'){toast('Catalogue preview only. Choose Calendly for the interactive example.');return}if(a==='analyze'){S.url=document.getElementById('docs').value.trim();try{const u=new URL(S.url);if(u.protocol!=='https:'||u.hostname!=='developer.calendly.com'||u.username||u.password)throw Error()}catch{S.error='This demo supports official Calendly URLs only. Restore the example URL to continue; no external URL is fetched.';render();return}go('busy');setTimeout(()=>go('capabilities'),850);return}if(a==='docs-fail'){S.error='Documentation could not be read. In production, check public access or provide a valid OpenAPI source; do not generate guessed endpoints. The example URL above can still continue in this demo.';render();return}if(a==='generate'){if(!S.members&&!S.events)return;resetEvidence();S.tab='config';S.file='client.js';go('busy');setTimeout(()=>go('review'),1000);return}if(a==='config-tab'||a==='code-tab'){S.tab=a==='code-tab'?'code':'config';render();return}if(a==='download'){exportExample();return}if(a==='review-code'){S.tab='code';go('review');return}if(a==='authorize'){S.authorized=true;resetEvidence();audit('Authorization simulated for Northstar');go('test');return}if(a==='run-sample'){resetEvidence();const errors={partial:S.members?'Page two failed after 20 of 25 expected sample members. Coverage is incomplete.':'A later event page failed. Event coverage is incomplete.',permission:'403 permission denied. Review selected scopes and organization administrator access.',schema:'Response schema changed: required stable identifier is missing.'};S.error=errors[S.scenario]||'';S.sample=!S.error;S.live=false;audit(S.sample?'Sample test scenario passed':'Sample test scenario blocked');render();return}if(a==='recover'){S.scenario='healthy';S.error='';S.sample=false;render();return}if(a==='run-live'){if(!S.sample)return;S.live=true;audit('Limited live-test result simulated');render();return}if(a==='activate-demo'||a==='approve-demo'){if(!S.sample||!S.live||(!S.approved&&a==='activate-demo'))return;S.approved=true;S.active=true;S.paused=false;audit(a==='approve-demo'?'Administrator approval and activation simulated':'Activation simulated by workspace administrator');go('monitor');return}if(a==='pause'){S.paused=!S.paused;audit(S.paused?'Connection paused in demo':'Connection resumed in demo');render();return}if(a==='refresh'){if(S.paused)return;audit('Complete sample sync illustrated');render();toast('Sample refreshed. No external API was called.');return}if(a==='live'&&!S.sample)return;if(a==='activate'&&(!S.sample||!S.live))return;if(titles[a])go(a)}
render();
</script></body></html>
